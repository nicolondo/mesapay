name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mesapay
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: mesapay_ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mesapay -d mesapay_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mesapay:integration_only@127.0.0.1:5432/mesapay_ci_test
      AUTH_SECRET: ci-isolated-test-secret-not-for-deployment
      KUSHKI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Traza + capturas de Playwright cuando falla: sin esto una falla de
      # navegador en CI sólo deja un "element(s) not found" y nadie puede
      # ver el DOM ni la red. Ver el FIXME del test de sign-in.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3390
  print-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
        working-directory: agent
